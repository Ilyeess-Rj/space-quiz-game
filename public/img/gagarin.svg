<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <radialGradient id="sp" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#121d4a"/>
      <stop offset="100%" stop-color="#03030f"/>
    </radialGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="55%" stop-color="#a9b8d4"/>
      <stop offset="100%" stop-color="#5d6c8c"/>
    </linearGradient>
    <radialGradient id="visor" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7fd4ff"/>
      <stop offset="45%" stop-color="#1b5fa8"/>
      <stop offset="100%" stop-color="#06122b"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbe6f7"/>
      <stop offset="100%" stop-color="#7a8aa8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#sp)"/>
  <g fill="#fff">
    <circle cx="50" cy="60" r="1.4" opacity=".8"/><circle cx="110" cy="30" r="1" opacity=".5"/>
    <circle cx="300" cy="45" r="1.5" opacity=".85"/><circle cx="390" cy="80" r="1.1" opacity=".55"/>
    <circle cx="440" cy="35" r="1.4" opacity=".8"/><circle cx="430" cy="180" r="1" opacity=".5"/>
    <circle cx="70" cy="200" r="1.3" opacity=".7"/><circle cx="200" cy="25" r="1" opacity=".5"/>
    <circle cx="350" cy="280" r="1.2" opacity=".6"/><circle cx="30" cy="280" r="1.4" opacity=".7"/>
  </g>
  <!-- capsule ring -->
  <g transform="translate(240 168)">
    <circle r="118" fill="none" stroke="#2b4b8f" stroke-width="10" opacity=".55"/>
    <circle r="118" fill="none" stroke="#4d9bff" stroke-width="2" opacity=".7"/>
    <!-- suit body -->
    <path d="M-62 92 C -70 40, -58 -18, 0 -26 C 58 -18, 70 40, 62 92 Z" fill="url(#suit)" stroke="#6b7c9c" stroke-width="2"/>
    <!-- collar -->
    <ellipse cx="0" cy="-22" rx="44" ry="12" fill="#93a4c2" opacity=".8"/>
    <!-- helmet -->
    <circle cx="0" cy="-58" r="48" fill="url(#helmet)" stroke="#8294b4" stroke-width="2"/>
    <!-- visor -->
    <path d="M-38 -60 C -38 -96, 38 -96, 38 -60 C 38 -34, 22 -24, 0 -24 C -22 -24, -38 -34, -38 -60 Z" fill="url(#visor)"/>
    <path d="M-30 -72 C -22 -88, 4 -90, 16 -80" stroke="#ffffff" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round"/>
    <!-- suit details -->
    <path d="M-40 30 Q 0 44, 40 30" stroke="#9fb0cc" stroke-width="2.5" fill="none" opacity=".7"/>
    <circle cx="-26" cy="52" r="5" fill="#4d9bff" opacity=".9"/>
    <circle cx="26" cy="52" r="5" fill="#22e08a" opacity=".9"/>
    <rect x="-14" y="20" width="28" height="14" rx="4" fill="#c9d6ec" opacity=".85"/>
  </g>
  <text x="240" y="300" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700"
        fill="#8fb6ff" text-anchor="middle" letter-spacing="3">IOURI GAGARINE · 1961</text>
</svg>