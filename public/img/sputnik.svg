<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <radialGradient id="space" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#101a45"/>
      <stop offset="100%" stop-color="#03030f"/>
    </radialGradient>
    <radialGradient id="metal" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e9eef8"/>
      <stop offset="45%" stop-color="#9aa7bf"/>
      <stop offset="100%" stop-color="#4a5570"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d9bff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4d9bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="320" fill="url(#space)"/>
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.4" opacity=".8"/><circle cx="90" cy="120" r="1" opacity=".5"/>
    <circle cx="150" cy="50" r="1.6" opacity=".9"/><circle cx="330" cy="70" r="1.2" opacity=".6"/>
    <circle cx="420" cy="40" r="1.5" opacity=".8"/><circle cx="450" cy="150" r="1" opacity=".5"/>
    <circle cx="380" cy="260" r="1.4" opacity=".7"/><circle cx="60" cy="250" r="1.2" opacity=".6"/>
    <circle cx="240" cy="30" r="1" opacity=".5"/><circle cx="300" cy="290" r="1.3" opacity=".7"/>
    <circle cx="120" cy="290" r="1" opacity=".5"/><circle cx="460" cy="220" r="1.5" opacity=".8"/>
  </g>
  <ellipse cx="240" cy="170" rx="150" ry="150" fill="url(#glow)"/>
  <!-- Earth horizon -->
  <path d="M0 320 C 120 250, 360 250, 480 320 Z" fill="#0a2a55" opacity=".85"/>
  <path d="M0 320 C 120 265, 360 265, 480 320 Z" fill="#12407a" opacity=".5"/>
  <!-- Sputnik body -->
  <g transform="translate(240 165)">
    <circle r="58" fill="url(#metal)" stroke="#6d7b96" stroke-width="2"/>
    <circle r="58" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
    <!-- panel lines -->
    <path d="M-58 0 H58" stroke="#7d8aa5" stroke-width="1.5" opacity=".55"/>
    <path d="M0 -58 V58" stroke="#7d8aa5" stroke-width="1" opacity=".3"/>
    <path d="M-41 -41 L41 41" stroke="#7d8aa5" stroke-width="1" opacity=".22"/>
    <path d="M41 -41 L-41 41" stroke="#7d8aa5" stroke-width="1" opacity=".22"/>
    <!-- highlight -->
    <ellipse cx="-18" cy="-22" rx="20" ry="14" fill="#fff" opacity=".35"/>
    <!-- reflect spikes -->
    <g stroke="#c8d4e8" stroke-width="3" stroke-linecap="round" opacity=".85">
      <path d="M-58 0 L-96 -10"/><path d="M-58 12 L-92 26"/>
      <path d="M58 0 L96 10"/><path d="M58 -12 L92 -26"/>
      <path d="M-18 57 L-26 94"/><path d="M20 56 L30 92"/>
      <path d="M-20 -57 L-30 -94"/><path d="M22 -56 L32 -92"/>
    </g>
  </g>
  <!-- label plate -->
  <text x="240" y="292" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700"
        fill="#8fb6ff" text-anchor="middle" letter-spacing="3">SPOUTNIK 1 · 1957</text>
</svg>