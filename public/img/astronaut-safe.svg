<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="95" r="92" fill="url(#glow)"/>
  <circle cx="35" cy="35" r="2" fill="#fff"/>
  <circle cx="150" cy="20" r="1.2" fill="#fff"/>
  <!-- meteorite FAR AWAY: tiny, harmless, distant in space -->
  <g opacity=".55">
    <path d="M186 4 L172 16" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
    <circle cx="170" cy="18" r="5" fill="#57534e"/>
    <circle cx="168.5" cy="16.5" r="1.4" fill="#44403c"/>
    <circle cx="171.5" cy="19.5" r="1" fill="#44403c"/>
  </g>
  <!-- body -->
  <rect x="62" y="118" width="76" height="62" rx="26" fill="url(#helmet)" stroke="#64748b" stroke-width="3"/>
  <rect x="80" y="138" width="40" height="24" rx="6" fill="#0f172a"/>
  <rect x="85" y="143" width="12" height="6" rx="2" fill="#34d399"/>
  <rect x="101" y="143" width="12" height="6" rx="2" fill="#7dd3fc"/>
  <!-- arms -->
  <rect x="36" y="124" width="26" height="44" rx="13" fill="url(#helmet)" stroke="#64748b" stroke-width="3"/>
  <rect x="138" y="96" width="26" height="46" rx="13" fill="url(#helmet)" stroke="#64748b" stroke-width="3" transform="rotate(-25 151 119)"/>
  <!-- thumbs up -->
  <circle cx="172" cy="88" r="12" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <rect x="176" y="70" width="8" height="16" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
  <!-- helmet -->
  <circle cx="100" cy="76" r="52" fill="url(#helmet)" stroke="#64748b" stroke-width="4"/>
  <circle cx="100" cy="76" r="40" fill="url(#visor)"/>
  <!-- happy calm face -->
  <circle cx="100" cy="80" r="28" fill="#f8c98d"/>
  <path d="M84 75 Q90 70 96 75" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M104 75 Q110 70 116 75" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M88 90 Q100 101 112 90" stroke="#1f2937" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <circle cx="82" cy="86" r="4" fill="#f472b6" opacity=".55"/>
  <circle cx="118" cy="86" r="4" fill="#f472b6" opacity=".55"/>
  <ellipse cx="80" cy="52" rx="14" ry="7" fill="#fff" opacity=".35" transform="rotate(-25 80 52)"/>
  <!-- check badge -->
  <circle cx="160" cy="160" r="22" fill="#052e22" stroke="#34d399" stroke-width="4"/>
  <path d="M150 160 l7 8 l14 -16" stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
